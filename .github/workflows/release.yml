name: release

on:
  # Every code push to main cuts a patch release automatically. Docs and
  # workflow-only changes don't release.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".github/**"
      - "monitor/**"
  # Manual run to pick the bump size (defaults to patch).
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump for this release"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already released as $(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Latest version = max over strict-semver git tags AND release tag
          # names (drafts included) — pre-releases like v0.0.1-rc.0 are
          # ignored, and names already consumed by a release are never
          # reused (this repo has immutable releases).
          latest="$( { git tag -l 'v*'; gh api 'repos/${{ github.repository }}/releases?per_page=100' --jq '.[].tag_name'; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r MA MI PA <<< "${latest#v}"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
            *) echo "unknown bump '$BUMP'"; exit 1 ;;
          esac
          next="v${MA}.${MI}.${PA}"
          echo "previous: $latest -> next: $next ($BUMP)"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          go-version-file: go.mod
          cache: true

      # The dashboard is built first so embed.FS compiles it into every
      # binary — release assets are fully self-contained (registry, web
      # UI, and bench prompts included).
      - name: Build dashboard
        if: steps.ver.outputs.skip == 'false'
        run: cd web && npm ci && npm run build

      - name: Test
        if: steps.ver.outputs.skip == 'false'
        run: go test ./cmd/... ./internal/... ./bench/...

      - name: Build binaries
        if: steps.ver.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/brokemode-${target%/*}-${target#*/}" ./cmd/brokemode
          done
          cd dist && sha256sum brokemode-* > checksums.txt

      # Immutable-release-safe publish: create a DRAFT, upload assets while
      # it's still mutable, then publish exactly once. If a name was burned
      # by a previous (even deleted) immutable release, bump patch and try
      # the next one. Stale drafts from earlier failed runs are removed
      # first so they don't shadow the tag.
      - name: Publish release
        if: steps.ver.outputs.skip == 'false'
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          gh api "repos/${REPO}/releases?per_page=100" \
            --jq '.[] | select(.draft) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .id' \
            | while read -r id; do
                echo "deleting stale draft release $id"
                gh api -X DELETE "repos/${REPO}/releases/${id}"
              done

          TAG="${{ steps.ver.outputs.next }}"
          for attempt in 1 2 3 4 5; do
            echo "attempt ${attempt}: releasing ${TAG}"
            if gh release create "$TAG" --draft --target "$SHA" --title "$TAG" --generate-notes dist/* \
               && gh release edit "$TAG" --draft=false; then
              echo "released ${TAG}"
              exit 0
            fi
            echo "could not publish ${TAG} (name likely burned by an immutable release); cleaning up and bumping patch"
            gh release delete "$TAG" --yes 2>/dev/null || true
            IFS=. read -r MA MI PA <<< "${TAG#v}"
            TAG="v${MA}.${MI}.$((PA+1))"
          done
          echo "failed to publish after 5 attempts"
          exit 1
