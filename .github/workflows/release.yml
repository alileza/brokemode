name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The dashboard is built first so embed.FS compiles it into every
      # binary — release assets are fully self-contained (registry, web
      # UI, and bench prompts included).
      - name: Build dashboard
        run: cd web && npm ci && npm run build

      - name: Test
        run: go test ./cmd/... ./internal/... ./bench/...

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/brokemode-${target%/*}-${target#*/}" ./cmd/brokemode
          done
          cd dist && sha256sum brokemode-* > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
